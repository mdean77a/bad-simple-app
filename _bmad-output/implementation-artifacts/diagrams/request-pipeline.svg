 y="412.0">every LLM section</tspan></text><path d="M426,389 L260,389" fill="none" stroke="#7d95a4" stroke-width="1.35" marker-end="url(#ah)"/><text paint-order="stroke" stroke="#fbfcfd" stroke-width="3.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#54646f"><tspan x="320.0" y="379.0">LLMConfigError</tspan></text><path d="M161,420 C161,440 48,446 48,486 L48,634 L352,648" fill="none" stroke="#7d95a4" stroke-width="1.35" marker-end="url(#ah)"/><path d="M570,404 L570,428" fill="none" stroke="#7d95a4" stroke-width="1.35" marker-end="url(#ah)"/><rect x="430" y="430" width="280" height="30" rx="4" fill="#eef3f6" stroke="#8fa6b4" stroke-width="1.25"/><text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#16202a"><tspan x="570.0" y="445.0">build_section_graph() → compile</tspan></text><path d="M570,460 L570,484" fill="none" stroke="#7d95a4" stroke-width="1.35" marker-end="url(#ah)"/><rect x="410" y="486" width="320" height="44" rx="4" fill="#eef3f6" stroke="#8fa6b4" stroke-width="1.25"/><text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#16202a"><tspan x="570.0" y="500.5">emit section_start for every LLM section,</tspan><tspan x="570.0" y="515.5">then graph.astream_events(version='v2')</tspan></text><rect x="60" y="486" width="300" height="44" rx="4" fill="#eef3f6" stroke="#8fa6b4" stroke-width="1.25"/><text text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#16202a"><tspan x="210.0" y="493.0">on_chat_model_stream →</tspan><tspan x="210.0" y="508.0">map langgraph_node to sectionId,</tspan><tspan x="210.0" y="523.0">emit section_chunk</tspan></text><rect x="60" y="548" width="300" height="44" rx="4" fill="#eef3f6" stroke="#8fa6b4" stroke-wid